[package]
name = "filterspec"
version = "0.1.0"
edition = "2021"
description = "Client filter DSL to Postgres predicate: parse, fold, render"
license = "MIT"
repository = "https://github.com/GlobalArtInc/filterspec"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rand = "0.8"

[lints.clippy]
unwrap_used = "deny"
